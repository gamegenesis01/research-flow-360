<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Research Flow 360</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; padding: 0; background: #ECEFE8; -webkit-text-size-adjust: 100%; }
    a { color: #0C1F1B; }
    img { border: 0; }
    @media (max-width: 480px) {
      h1 { font-size: 28px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#ECEFE8">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ECEFE8">
    <tr>
      <td align="center" style="padding:24px 8px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px">
          <tr>
            <td>
              {{ message_content }}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px 8px;font:400 12px/1.6 Geist,'Helvetica Neue','Segoe UI',Helvetica,Arial,sans-serif;color:#7C8A85;text-align:center">
              You're receiving this because you signed up for Research Flow 360.<br>
              <a href="{{ unsubscribe_url }}" style="color:#4A5A55">Unsubscribe</a>
              &nbsp;·&nbsp; {{ address }}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
